name: CI
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Benysta.EasyPay.Integration/Benysta.EasyPay.Integration.slnx
      - name: Build
        run: dotnet build Benysta.EasyPay.Integration/Benysta.EasyPay.Integration.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Benysta.EasyPay.Integration/Benysta.EasyPay.Integration.slnx --configuration Release --no-build --verbosity normal
